[workspace]
members = ["budgetbranch", "demo-receiver", "test-adversary", "sandbox-tests"]
default-members = ["budgetbranch", "demo-receiver"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
near-sdk = { version = "=5.30.1" }
borsh = { version = "1.6.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
